# LoRa Star library — compile both roles; role selected at build time via Kconfig
CONFIG_LORA_STAR=y
CONFIG_LORA_STAR_ROLE_DUAL=y
CONFIG_LORA_STAR_PAIRING=y
CONFIG_LORA_STAR_PAIRING_BUTTON=y

# Disable stack-level retries so the application has full visibility of each
# individual attempt and can track retry statistics accurately.
CONFIG_LORA_STAR_TX_MAX_RETRIES=0

# LoRa radio driver (board-specific; enable the matching driver)
CONFIG_LORA=y

# Crypto — PSA Crypto API backed by mbedTLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_BUILTIN=y
CONFIG_PSA_CRYPTO=y
# ECDH / Curve25519 (X25519)
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
# HKDF-SHA256
CONFIG_PSA_WANT_ALG_HKDF=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_KEY_TYPE_DERIVE=y
# AES-128-CTR
CONFIG_PSA_WANT_ALG_CTR=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# AES-CMAC
CONFIG_PSA_WANT_ALG_CMAC=y

# Persistent settings
CONFIG_SETTINGS=y
CONFIG_SETTINGS_ZMS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_ZMS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Hardware ID and entropy
CONFIG_HWINFO=y
CONFIG_ENTROPY_GENERATOR=y

# GPIO for pairing button
CONFIG_GPIO=y

# Power management — both roles idle-block on a single event queue
# (k_msgq_get K_FOREVER), so the CPU is free to enter the deepest SoC sleep
# state between LoRa IRQs, button presses and periodic timers.  On
# lora_e5_dev_board this reaches STM32 STOP0/1/2. Runtime device PM lets the
# console UART suspend between log lines instead of staying clocked.
#CONFIG_PM=y
#CONFIG_PM_DEVICE=y
#CONFIG_PM_DEVICE_RUNTIME=y

# Logging
CONFIG_LOG=y
CONFIG_LORA_STAR_LOG_LEVEL_INF=y

# Avoid picolibc ABI mismatch between Zephyr 4.1.0 and SDK 0.17.x
CONFIG_MINIMAL_LIBC=y
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
